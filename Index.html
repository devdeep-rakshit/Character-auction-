<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>Character Auction</title>
<style>
:root{--bg:#080b14;--panel:#11182a;--border:#293651;--blue:#42caff;--purple:#a78bfa;--green:#19d89a;--red:#ff5268;--text:#f4f7ff;--muted:#99a8c4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172442,var(--bg) 65%);color:var(--text);font-family:system-ui,Arial,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{border:0;cursor:pointer;border-radius:10px;padding:12px 14px;font-weight:750;touch-action:manipulation}button:active{transform:scale(.98)}button:disabled{opacity:.35;cursor:not-allowed}
input,textarea{background:#080e1c;color:white;border:1px solid #344463;border-radius:9px;padding:12px;width:100%;outline:none}input:focus,textarea:focus{border-color:var(--blue)}
header{text-align:center;padding:22px 12px 14px}header h1{margin:0;font-size:clamp(25px,7vw,38px);letter-spacing:1px;background:linear-gradient(90deg,var(--blue),var(--purple));color:transparent;background-clip:text}header p{color:var(--muted);font-size:13px;margin:7px 0 0}
main{max-width:760px;margin:auto;padding:10px 12px 30px}.panel{background:rgba(17,24,42,.96);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}.section-title{font-size:12px;color:var(--muted);letter-spacing:1.3px;font-weight:800;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.setup-bottom{margin-top:12px}.primary{background:linear-gradient(100deg,#2563eb,#7138e8);color:white}.green{background:#087f5b;color:white}.red{background:#8e2034;color:white}.gold{background:#a66a09;color:white}.outline{background:#1b2740;color:white;border:1px solid #354867}.full{width:100%}.hidden{display:none!important}.notice{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.auction-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}.status{color:var(--green);font-size:12px;font-weight:800;letter-spacing:1px}.round{color:var(--muted);font-size:12px}
.character{text-align:center;padding:22px 12px;border-radius:15px;border:1px solid #2b5d91;background:linear-gradient(135deg,#102849,#17152f)}.character .label{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.7px}.character h2{font-size:clamp(26px,8vw,38px);margin:12px 0 16px;overflow-wrap:anywhere}.character input{max-width:430px;text-align:center;font-size:16px;margin-bottom:9px}.bid-info{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px}.bid-number{font-size:12px;color:var(--muted)}.bid-number strong{color:white;font-size:21px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.player{background:linear-gradient(155deg,#101d32,#111425);border:1px solid #24567b;border-radius:14px;padding:13px;min-width:0}.player:nth-child(even){border-color:#6840a0}.player-name{font-size:17px;font-weight:800;overflow-wrap:anywhere}.player-label{color:var(--muted);font-size:11px}.budget{font-size:clamp(30px,8vw,40px);font-weight:900;color:var(--blue);margin:8px 0 0;line-height:1.2}.budget small{font-size:12px}
.current-bid{display:flex;justify-content:space-between;align-items:center;gap:5px;border-top:1px solid var(--border);margin-top:12px;padding-top:10px}.current-bid strong{font-size:22px}.bid-controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.bid-controls button{padding:12px 5px;font-size:13px}.bid-plus{color:#041d17;background:var(--green);font-size:17px!important}.bid-minus{background:#29344a;color:white}.win-button{grid-column:1/-1;background:#4931bf;color:white}.character-list{color:#c5d4f2;font-size:12px;margin-top:12px;border-top:1px solid var(--border);padding-top:10px;overflow-wrap:anywhere}.character-list strong{color:white}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{font-size:13px;padding:12px 7px}#winnerBanner{text-align:center;color:var(--green);font-weight:800;font-size:16px;padding:10px;line-height:1.4}
#awardModal{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
#awardModal.hidden{display:none!important}
.award-backdrop{position:absolute;inset:0;background:rgba(2,6,18,.78);backdrop-filter:blur(7px)}
.award-dialog{position:relative;width:100%;max-width:380px;padding:25px 21px 20px;text-align:center;background:linear-gradient(155deg,#172640,#17172d);border:1px solid #3c5480;border-radius:22px;box-shadow:0 24px 80px #0009;animation:modalIn .18s ease-out}
.award-icon{font-size:34px;margin-bottom:6px}
.award-eyebrow{font-size:11px;letter-spacing:2px;color:var(--blue);font-weight:850}
.award-dialog h3{font-size:24px;margin:8px 0 10px}
.award-dialog p{color:#c4d0e8;line-height:1.55;font-size:15px;margin:0 0 22px;overflow-wrap:anywhere}
.award-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.award-actions button{min-height:48px}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:420px){.award-dialog{padding:22px 16px 16px;border-radius:20px}.award-dialog h3{font-size:22px}}
/* Mobile-first refinements */
@media(max-width:700px){
  header{padding:18px 14px 12px}
  header h1{font-size:clamp(24px,7vw,34px);line-height:1.12}
  header p{font-size:13px;line-height:1.45}
  main{padding:8px 10px 24px}
  .panel{padding:14px;border-radius:15px;margin-bottom:12px}
  .auction-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .auction-top .status{grid-column:1}
  .auction-top .round{grid-column:1;grid-row:2}
  .auction-top button{grid-column:2;grid-row:1/3;max-width:150px;white-space:normal}
  .character{padding:20px 12px}
  .character h2{font-size:32px;margin:10px 0 16px}
  .character #nextCharacterBtn{width:100%;max-width:360px;white-space:normal}
  .players{grid-template-columns:1fr;gap:12px;margin-top:12px}
  .player{padding:16px;border-radius:16px}
  .player-name{font-size:20px}
  .budget{font-size:38px}
  .current-bid strong{font-size:24px}
  .bid-controls{gap:8px}
  .bid-controls button{min-height:48px;padding:11px 8px;font-size:14px}
  .bid-plus{font-size:17px!important}
  .win-button{min-height:50px}
  .actions{gap:8px}
  .actions button{min-height:46px;font-size:14px;padding:11px 8px}
  .grid{grid-template-columns:1fr 1fr}
  .field input,.field textarea{font-size:16px}
}
@media(max-width:420px){
  .grid{grid-template-columns:1fr}
  .auction-top button{font-size:12px;padding:10px}
  .bid-controls button{font-size:13px}
}

/* Compact phone auction view: keep both players' bidding controls side by side. */
@media (max-width: 700px) {
  body { font-size: 14px; }
  header { padding: 10px 10px 4px !important; }
  header h1 { font-size: 25px !important; margin: 0 0 4px !important; }
  header p { font-size: 11px !important; margin: 0 !important; }
  main { padding: 5px 8px 14px !important; }
  .auction-top { margin: 4px 0 8px !important; gap: 6px !important; }
  .auction-top button, #newAuction { padding: 8px 10px !important; font-size: 12px !important; }
  .character { padding: 10px 10px !important; margin-bottom: 8px !important; }
  .character .eyebrow, .character-label { font-size: 10px !important; letter-spacing: 1px !important; }
  .character h2 { font-size: 25px !important; margin: 5px 0 8px !important; }
  #nextCharacterBtn { padding: 10px 8px !important; font-size: 14px !important; }
  .character .subtext, #poolStatus { font-size: 11px !important; line-height: 1.3 !important; margin: 6px 0 !important; }
  .character .highest, .character .leader, #highestBid, #leader { font-size: 17px !important; }
  .players { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 7px !important; margin-top: 7px !important; align-items: start; }
  .player { padding: 9px !important; border-radius: 12px !important; }
  .player-name { font-size: 15px !important; line-height: 1.2 !important; }
  .player-label { font-size: 9px !important; }
  .budget { font-size: 27px !important; margin-top: 3px !important; }
  .budget small { font-size: 10px !important; }
  .current-bid { margin-top: 7px !important; padding-top: 6px !important; gap: 2px !important; font-size: 10px !important; flex-wrap: wrap; }
  .current-bid strong { font-size: 20px !important; }
  .current-bid small { font-size: 10px !important; }
  .turn-label { font-size: 10px !important; margin: 5px 0 !important; }
  .bid-controls { grid-template-columns: 1fr 1fr !important; gap: 5px !important; margin-top: 7px !important; }
  .bid-controls button { min-width: 0 !important; min-height: 43px !important; padding: 7px 3px !important; font-size: 11px !important; line-height: 1.15 !important; overflow-wrap: anywhere; }
  .bid-controls .bid-plus { font-size: 14px !important; }
  .bid-controls .win-button { grid-column: 1 / -1 !important; min-height: 40px !important; font-size: 11px !important; }
  .character-list { font-size: 10px !important; margin-top: 7px !important; padding-top: 7px !important; }
  .actions { gap: 5px !important; }
  .actions button { min-height: 38px !important; padding: 7px 4px !important; font-size: 11px !important; }
}
@media (max-width: 380px) {
  header h1 { font-size: 22px !important; }
  .player { padding: 7px !important; }
  .bid-controls button { font-size: 10px !important; }
  .budget { font-size: 24px !important; }
}

  html, body { margin:0 !important; padding:0 !important; }
  body { font-size:12px !important; }
  header { padding:7px 8px 3px !important; }

  header p { display:none !important; }
  main { padding:4px 6px 10px !important; max-width:none !important; }
  .panel { padding:8px !important; margin-bottom:6px !important; border-radius:11px !important; }
  .auction-top { display:flex !important; align-items:center !important; justify-content:space-between !important; gap:5px !important; margin:0 0 6px !important; }

  .current-bid small { font-size:8px !important; }

  .bid-controls { display:flex !important; flex-direction:column !important; gap:4px !important; margin-top:5px !important; }
  .bid-controls button { width:100% !important; min-width:0 !important; min-height:31px !important; padding:4px 2px !important; font-size:9px !important; line-height:1.1 !important; white-space:normal !important; overflow-wrap:anywhere !important; border-radius:7px !important; }

/* Screenshot-inspired esports auction theme */
:root{--bg:#020714;--panel:#07152a;--border:#164e86;--blue:#16cfff;--purple:#a12cff;--green:#00f0a0;--red:#ff285f;--gold:#ffc247;--text:#f5f8ff;--muted:#9ab2d9}
html{background:#020714}
body{
 margin:0;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh;
 background:
 radial-gradient(ellipse at 0% 8%,rgba(0,145,255,.2),transparent 32%),
 radial-gradient(ellipse at 100% 12%,rgba(180,0,255,.18),transparent 30%),
 radial-gradient(ellipse at 50% 55%,rgba(0,57,119,.16),transparent 55%),
 #020714;
}
header{position:relative;text-align:center;padding:18px 10px 12px;border-bottom:1px solid #123456;background:linear-gradient(180deg,rgba(4,15,35,.96),rgba(2,7,20,.6))}
header:before{content:"⚔";display:block;color:#d8e8ff;font-size:22px;line-height:1;margin-bottom:5px;text-shadow:0 0 18px #32bfff}
header h1{font-size:clamp(29px,8vw,48px);font-weight:1000;font-style:italic;letter-spacing:-1px;line-height:.96;text-transform:uppercase;background:linear-gradient(100deg,#00d8ff 5%,#7b6cff 52%,#ff42d2 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 15px #126aff45)}
header p{color:#c0d0ed;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin:9px 0 0}
main{max-width:1000px;margin:auto;padding:10px 12px 20px}
.panel{background:linear-gradient(145deg,rgba(5,20,43,.96),rgba(8,10,30,.97));border:1px solid #174b7b;border-radius:18px;padding:13px;margin-bottom:10px;box-shadow:0 0 22px #006cff0b,inset 0 0 20px #073d6818}
.section-title{font-size:11px;color:#73a9ff;letter-spacing:2.5px;font-weight:900;margin-bottom:9px;text-transform:uppercase}
button{border-radius:10px;border:1px solid transparent;font-weight:800;letter-spacing:.1px;box-shadow:0 3px 12px #0004;transition:filter .12s,transform .12s}
button:active{filter:brightness(1.18);transform:scale(.985)}
.primary{background:linear-gradient(110deg,#087bff,#7d22ef);color:white;border-color:#367cff;box-shadow:0 0 18px #4a2cff4d}
.green{background:linear-gradient(110deg,#00e99b,#00b99e);color:#03241e}
.red{background:linear-gradient(110deg,#ff245b,#a7005b);color:white}
.gold{background:linear-gradient(110deg,#ffd35a,#ff9700);color:#281400}
.outline{background:linear-gradient(135deg,#101f3d,#10142c);color:#eaf2ff;border-color:#304d7c}
input,textarea{background:#040b19;border-color:#24436c;color:white}
.auction-top{margin:0 0 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.status{justify-self:start;border:1px solid #00a878;border-radius:10px;padding:8px 10px;color:#00ffb0;background:#002c25;font-size:11px;box-shadow:0 0 16px #00f0a022}
.round{justify-self:center;color:#a6c4f3;font-size:12px}
.auction-top button{justify-self:end;background:linear-gradient(110deg,#0d1733,#19132f);border:1px solid #6846e9;box-shadow:0 0 14px #802aff25;padding:9px 12px;font-size:12px}
.character{position:relative;overflow:hidden;text-align:center;padding:18px 12px 13px;border-radius:20px;border:1px solid #236cbb;background:radial-gradient(ellipse at 50% 0%,#122d58 0%,#07172f 53%,#090b22 100%);box-shadow:0 0 25px #087bff18,inset 0 0 35px #145aff10;margin-bottom:10px}
.character:before,.character:after{content:"";position:absolute;width:120px;height:180px;top:20px;opacity:.13;pointer-events:none;background:linear-gradient(135deg,transparent 40%,#12cfff 41%,transparent 43%),linear-gradient(45deg,transparent 47%,#bf3bff 48%,transparent 50%);transform:rotate(20deg)}
.character:before{left:-30px}.character:after{right:-30px;transform:rotate(-20deg)}
.character .label{color:#55caff;font-size:11px;letter-spacing:3px;font-weight:900}
.character h2{position:relative;font-size:clamp(32px,8vw,56px);line-height:1;margin:10px 0 13px;font-weight:1000;text-shadow:0 0 22px #6c9dff75}
.character #nextCharacterBtn{position:relative;min-height:40px;padding:9px 16px;font-size:12px}
#poolStatus{font-size:11px;color:#a9bfdf;margin:8px 0}
.bid-info{gap:14px}
.bid-number{color:#a9bfdf;font-size:11px}
.bid-number strong{font-size:21px;color:#fff}
#leader{overflow-wrap:anywhere}
#players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 10px;align-items:stretch}
.player{min-width:0;position:relative;overflow:hidden;padding:10px 9px;border-radius:15px;border:1px solid #087fbd;background:linear-gradient(155deg,rgba(5,33,55,.98),rgba(4,11,28,.99) 70%);box-shadow:0 0 15px #00cfff12,inset 0 0 24px #00cfff0a}
.player:nth-child(3n+2){border-color:#7534d8;background:linear-gradient(155deg,rgba(27,12,57,.98),rgba(7,9,27,.99) 70%);box-shadow:0 0 15px #9d38ff18,inset 0 0 24px #9d38ff0b}
.player:nth-child(3n){border-color:#a56b19;background:linear-gradient(155deg,rgba(43,28,12,.95),rgba(11,10,22,.99) 70%);box-shadow:0 0 15px #ffb72a12,inset 0 0 24px #ffb72a08}
.player-name{font-size:14px;font-weight:900;line-height:1.2;min-height:24px}
.player-label{font-size:9px;color:#9bb7e4;letter-spacing:.35px}
.budget{font-size:clamp(22px,5vw,31px);font-weight:1000;color:#19caff;line-height:1.05;margin:3px 0 8px}
.budget small{font-size:10px}
.current-bid{display:block;border-top:1px solid #234064;margin-top:6px;padding-top:6px;font-size:9px}
.current-bid strong{display:block;font-size:22px;line-height:1.1;margin-top:2px}
.turn-label{min-height:18px;margin:7px 0 4px;font-size:9px;font-weight:900;color:#00f0b0}
.bid-controls{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.bid-controls button{width:100%;min-width:0;min-height:36px;padding:6px 4px;font-size:10px;line-height:1.12;white-space:normal;overflow-wrap:anywhere;border-radius:9px}
.bid-controls .bid-minus{background:linear-gradient(135deg,#142844,#17203a);color:#b6d5f4;border:1px solid #25446a}
.bid-controls .bid-plus{background:linear-gradient(110deg,#00efa4,#00b8a8);color:#03241d;font-size:12px!important;border-color:#00f0ad;box-shadow:0 0 13px #00e6a42b}
.bid-controls .win-button{background:linear-gradient(110deg,#30205b,#392044);border:1px solid #6c4aa0;color:#ffd36c;font-size:9px}
.character-list{font-size:10px;margin-top:8px;padding-top:7px;border-top:1px solid #253a5c;color:#bfd3f4}
.character-list strong{color:#eef5ff}
.actions{gap:7px}
.actions but
